description: >
    This defines a Port Metric to be exposed for system management.
    It contains properties that describe different counters of ports
    of device.

properties:
    - name: TXPkts
      type: uint64
      default: 0
      description: >
          The total number of packets transmitted on port.
      flags:
          - readonly

    - name: RXPkts
      type: uint64
      default: 0
      description: >
          The total number of packets received on port.
      flags:
          - readonly

    - name: RXMulticastPkts
      type: uint64
      default: 0
      description: >
          The total number of multicast packets received on a device.
      flags:
          - readonly

    - name: RXUnicastPkts
      type: uint64
      default: 0
      description: >
          The total number of unicast packets received on a device.
      flags:
          - readonly

    - name: MalformedPkts
      type: uint64
      default: 0
      description: >
          The total number of malformed packets.
      flags:
          - readonly

    - name: VL15DroppedPkts
      type: uint64
      default: 0
      description: >
          The total number of VL15 dropped packets.
      flags:
          - readonly

    - name: RXErrors
      type: uint64
      default: 0
      description: >
          The total number of packets containing errors.
      flags:
          - readonly

    - name: VL15TXPkts
      type: uint64
      default: 0
      description: >
          The total number of packets transmitted on a device [VL15].
      flags:
          - readonly

    - name: VL15TXData
      type: uint64
      default: 0
      description: >
          Transmitted data from the port [VL15].
      flags:
          - readonly

    - name: TXUnicastPkts
      type: uint64
      default: 0
      description: >
          The total number of unicast packets transmitted on a device.
      flags:
          - readonly

    - name: TXMulticastPkts
      type: uint64
      default: 0
      description: >
          The total number of multicast packets transmitted on a device.
      flags:
          - readonly

    - name: TXBroadcastPkts
      type: uint64
      default: 0
      description: >
          The total number of broadcast packets transmitted on a device.
      flags:
          - readonly

    - name: TXDiscardPkts
      type: uint64
      default: 0
      description: >
          The total number of discarded packets during transmision.
      flags:
          - readonly

    - name: MTUDiscard
      type: uint64
      default: 0
      description: >
          The total number of discarded due to MTU [maximum transmit unit].
      flags:
          - readonly

    - name: IBG2RXPkts
      type: uint64
      default: 0
      description: >
          The total number of packets received on a device [IBG2].
      flags:
          - readonly

    - name: IBG2TXPkts
      type: uint64
      default: 0
      description: >
          The total number of packets transmitted on a device [IBG2].
      flags:
          - readonly

    - name: LinkErrorRecoveryCounter
      type: uint64
      description: >
          Link recovery error count.
      flags:
          - readonly

    - name: LinkDownCount
      type: uint64
      default: 0
      description: >
          The total number of times link was downed.
      flags:
          - readonly
    
    - name: UnintentionalLinkDownCount
      type: uint64
      default: 0
      description: >
          The total number of times the link went down unexpectedly or unintentionally.
      flags:
          - readonly

    - name: IntentionalLinkDownCount
      type: uint64
      default: 0
      description: >
          The total number of times the link was deliberately brought down.
      flags:
          - readonly
    
    - name: LinkDownReasonCode
      type: enum[self.LinkDownReasonCodes]
      default: NoLinkDown
      description: >
          Indicates the reason code for link being down.
      flags:
          - readonly

    - name: RXRemotePhysicalErrorPkts
      type: uint64
      default: 0
      description: >
          The total number of remote physical error received on port.
      flags:
          - readonly

    - name: RXSwitchRelayErrorPkts
      type: uint64
      default: 0
      description: >
          The total number of switch relay error received on the port.
      flags:
          - readonly

    - name: QP1DroppedPkts
      type: uint64
      default: 0
      description: >
          The total number of Qp1 dropped packets.
      flags:
          - readonly

    - name: TXWait
      type: uint64
      default: 0
      description: >
          The total number of times the transmission was waiting.
      flags:
          - readonly

    - name: BitErrorRate
      type: double
      default: 0.0
      description: >
          The bit error rate on the link.
      flags:
          - readonly

    - name: EffectiveBER
      type: double
      default: 0.0
      description: >
          The effective BER on the link.
      flags:
          - readonly

    - name: EstimatedEffectiveBER
      type: double
      default: 0.0
      description: >
          The estimated effective BER on the link.
      flags:
          - readonly

    - name: EffectiveError
      type: uint64
      default: 0
      description: >
          The effective error counter on the link.
      flags:
          - readonly

    - name: SymbolErrors
      type: uint64
      default: 0
      description: >
          The symbol error counter on the link.
      flags:
        - readonly
    
    - name: PerLaneRawErrors
      type: array[uint64]
      description: >
          The total number of raw bit errors detected on the link before error correction for each lane.
      flags:
        - readonly

    - name: PerLaneRawBER
      type: array[double]
      description: >
          The raw bit error rate (BER) on the link, measured as the ratio of error bits to total bits transmitted before any error correction is applied for each lane.
      flags:
          - readonly

    - name: TotalRawBER
      type: double
      description: >
          The total raw bit error rate (BER) on the link, measured as the ratio of error bits to total bits transmitted before any error correction is applied.
      flags:
        - readonly

enumerations:
    - name: LinkDownReasonCodes
      description: >
          Enumeration of possible reasons for a port entering down state.
      values:
          - name: NoLinkDown
            description: >
              Port is operating normally with no link down condition.
          - name: Unknown
            description: >
              Port down reason cannot be determined.
          - name: HighBitErrorRate
            description: >
              Port disabled due to high bit error rate detected.
          - name: BlockLockLost
            description: >
              Port down due to loss of block alignment in the physical layer.
          - name: AlignmentLost
            description: >
              Port down due to loss of data alignment in the communication stream.
          - name: FECSyncLost
            description: >
              Forward Error Correction synchronization has been lost.
          - name: PllLockLost
            description: >
               Port down due to loss of Phase-Locked Loop (PLL) synchronization.
          - name: FIFOOverflow
            description: >
              First-In-First-Out buffer overflow condition detected.
          - name: FalseSkipDetected
            description: >
              Invalid skip condition detected in the data stream.
          - name: MinorErrorThresholdExceeded
            description: >
              Accumulated minor errors exceeded the configured threshold.
          - name: PhyRetransmitTimeout
            description: >
              Physical layer retransmission timeout occurred.
          - name: HeartbeatErrors
            description: >
              Port down due to missing heartbeat signals.
          - name: CreditMonitorWatchdogTimeout
            description: >
              Link layer credit monitoring watchdog timeout occurred.
          - name: LinkLayerIntegrityThresholdExceeded
            description: >
              Link layer integrity errors exceeded threshold.
          - name: LinkLayerBufferOverrun
            description: >
              Link layer buffer overrun condition detected.
          - name: OOBCommandLinkHealthy
            description: >
              Out-of-band command link reports healthy status.
          - name: OOBCommandLinkHighBER
            description: >
              Out-of-band command link reports high bit error rate.
          - name: InbandCommandLinkHealthy
            description: >
              In-band command link reports healthy status.
          - name: InbandCommandLinkHighBER
            description: >
              In-band command link reports high bit error rate.
          - name: VerificationGatewayDown
            description: >
              Port disabled by verification gateway.
          - name: RemoteFaultReceived
            description: >
              Remote fault signal received from link partner.
          - name: TrainingSequenceReceived
            description: >
              Training sequence received from link partner.
          - name: ManagementCommandDown
            description: >
              Port disabled by management command.
          - name: CableDisconnected
            description: >
              Physical cable disconnection detected.
          - name: CableAccessFault
            description: >
              Unable to properly access or communicate with the cable.
          - name: ThermalShutdown
            description: >
              Port disabled due to thermal protection threshold.
          - name: CurrentIssue
            description: >
              Port disabled due to current-related issues.
          - name: PowerBudgetExceeded
            description: >
              Port disabled due to power budget constraints.
          - name: FastRawBERRecovery
            description: >
              Port in recovery mode due to raw bit error rate issues.
          - name: FastEffectiveBERRecovery
            description: >
              Port in recovery mode due to effective bit error rate issues.
          - name: FastSymbolBERRecovery
            description: >
              Port in recovery mode due to symbol error rate issues.
          - name: FastCreditWatchdogRecovery
            description: >
              Port in recovery mode due to credit watchdog timeout.
          - name: PeerSleep
            description: >
              Port down due to peer device entering sleep mode.
          - name: PeerDisabled
            description: >
              Port down due to peer device being disabled.
          - name: PeerDisableLocked
            description: >
              Port down due to peer device being locked in disabled state.
          - name: PeerThermalEvent
            description: >
              Port down due to thermal event on peer device.
          - name: PeerForcedEvent
            description: >
              Port down due to forced shutdown of peer device.
          - name: PeerResetEvent
            description: >
              Port down due to peer device reset.