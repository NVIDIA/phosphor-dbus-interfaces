description: >
    Implement to specify the 3-Port Switch Ports mode of operation.

properties:
    - name: ThreePortSwitchPortsMode
      type: enum[self.Modes]
      description: >
          The 3-Port Switch Ports mode.

enumerations:
    - name: Modes
      description: >
          Possible modes of 3-Port Switch Ports.
      values:
          - name: None
            description: >
                Allow, no Ports to access the RJ45.
          - name: BMC
            description: >
                Allow, only the BMC to access to RJ45.
          - name: DPU
            description: >
                Allow, only the DPU to access to RJ45.
          - name: All
            description: >
                Allow, both BMC and DPU to access the RJ45.
          - name: Disabled
            description: >
                3-Port Switch disabled.
