description: >
    Manager-wide configuration for Zapp streaming telemetry. One instance of
    this interface, hosted by the settings service, is the single source of
    truth every Zapp component on a Manager consumes: the producers (for
    example nsmd and pldmd) on an HMC, the gateway daemon on a BMC. They watch
    this object for PropertiesChanged and reconfigure at run time without a
    restart.

    The endpoint is typed (address, port, transport) in the manner of
    xyz.openbmc_project.Network.Client. The Redfish representation composes
    it into the single URI the Zapp specification defines (TelemetryEndpoint)
    and splits it again on write; that mapping is bmcweb's and is not part of
    this interface. The Zapp specification defines one endpoint: the actuation
    control channel (specification section 19) goes to the same host and port
    over TCP when ActuationEnabled is true, so it has no address of its own.

properties:
    - name: Enabled
      type: boolean
      default: false
      description: >
          Whether Zapp telemetry streaming is enabled on this Manager. When
          false, producers emit nothing and a gateway forwards nothing; both
          stay otherwise running. Defaults to false so telemetry is opt-in.
    - name: Address
      type: string
      default: ""
      description: >
          IP address or resolvable host name of the telemetry destination:
          the collector for a BMC gateway, the gateway's telemetry ingress for
          an HMC producer. Empty means no destination is configured and
          streaming stays inactive regardless of Enabled.
      errors:
          - xyz.openbmc_project.Common.Error.InvalidArgument
    - name: Port
      type: uint16
      default: 9091
      description: >
          UDP or QUIC port of the telemetry destination. 9091 is the Zapp
          specification's default. 0 is not a valid value.
      errors:
          - xyz.openbmc_project.Common.Error.InvalidArgument
    - name: Transport
      type: enum[self.Transport]
      default: UDP
      description: >
          Egress profile towards the telemetry destination, from the Zapp
          specification's protocol table. An HMC producer streams UDP to the
          gateway on the internal link; a BMC gateway may use UDP or either
          QUIC profile towards the collector.
    - name: ActuationEnabled
      type: boolean
      default: false
      description: >
          Whether the actuation channel (controller requests towards the
          producers) is enabled on this Manager. Independent of Enabled. When
          true, an HMC producer opens its actuation connection to
          tcp://Address:Port, the same host and port as the telemetry
          destination; a BMC gateway accepts actuation on TCP at the port it
          receives telemetry on. Empty Address or Port 0 leaves the channel
          closed.

enumerations:
    - name: Transport
      description: >
          Zapp egress profiles.
      values:
          - name: UDP
            description: >
                Zapp containers in UDP datagrams.
          - name: QUICStream
            description: >
                Zapp containers on a QUIC stream (TLS 1.3).
          - name: QUICDatagram
            description: >
                Zapp containers in QUIC DATAGRAM frames (TLS 1.3).
