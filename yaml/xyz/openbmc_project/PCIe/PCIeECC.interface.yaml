description: >
    Implement to provide PCIe ECC attributes.
properties:
    - name: ceCount
      type: double
      default: 0.0
      description: >
          The total number of the PCIe correctable errors on the device.
    - name: nonfeCount
      type: double
      default: 0.0
      description: >
          The total number of the PCIe non-fatal errors on the device.
    - name: feCount
      type: double
      default: 0.0
      description: >
          The total number of the PCIe fatal errors on the device.
    - name: L0ToRecoveryCount
      type: double
      default: 0.0
      description: >
          The total number of times the PCIe link transitioned from
          L0 to the recovery state for the device.
    - name: ReplayCount
      type: double
      default: 0.0
      description: >
          The total number of the replays issued on the PCIe link on
          the device.
    - name: ReplayRolloverCount
      type: double
      default: 0.0
      description: >
          The total number of replay rollovers issued on the PCIe link
          on the device.
    - name: NAKSentCount
      type: double
      default: 0.0
      description: >
          The total number of NAKs issued on the PCIe link on the device.
    - name: NAKReceivedCount
      type: double
      default: 0.0
      description: >
          The total number of NAKs issued on the PCIe link by the receiver.
    - name: BadTLPCount
      type: double
      default: 0.0
      description: >
          The total number of Bad TLPs issued on the PCIe link by the receiver.
    - name: FCTimeoutErrors
      type: double
      default: 0.0
      description: >
          The total number of recovery trips due to Flow Credit timeout.
    - name: ueCount
      type: uint32
      default: 0
      description: >
          The total number of the PCIe uncorrectable errors on the device.
    - name: UnsupportedRequestCount
      type: double
      default: 0.0
      description: >
          The total number of unsupported request counts on the device.
    - name: ReceiverErrorCount
      type: double
      default: 0.0
      description: >
          The total number of receiver errors detected on the PCIe link.
    - name: TrainingSequenceErrorCount
      type: double
      default: 0.0
      description: >
          Training Sequence errors causing L0 to Recovery state transition.
    - name: FramingErrorCount
      type: double
      default: 0.0
      description: >
          Framing errors causing L0 to Recovery state transition.
    - name: LinkDownedCount
      type: double
      default: 0.0
      description: >
          Count of link down events
    - name: DLLPCRCErrorCount
      type: double
      default: 0.0
      description: >
          Data Link Layer Packet (DLLP) CRC error counter.
    - name: TLPCRCErrorCount
      type: double
      default: 0.0
      description: >
          Transaction Layer Packet (TLP) CRC error counter.
    - name: PCIeType
      type: enum[self.PCIeTypes]
      default: 'Unknown'
      description: >
          The PCIe interface generation in use by the device.
    - name: MaxLanes
      type: size
      default: 0
      description: >
          The maximum number of PCIe lanes supported by the PCIe Device
    - name: LanesInUse
      type: size
      default: maxint
      description: >
          The number of PCIe lanes in use by this device. Default value of
          maxint is to accommodate the situation where the value of this
          property is not known due to some unknown reason, like hardware
          failure. The value of 0 indicates that the link is not active.

enumerations:
    - name: PCIeTypes
      description: >
          Possible PCIe generations
      values:
        - name: 'Gen1'
          description: >
              PCIe v1.0 device

        - name: 'Gen2'
          description: >
              PCIe v2.0 device

        - name: 'Gen3'
          description: >
              PCIe v3.0 device

        - name: 'Gen4'
          description: >
              PCIe v4.0 device

        - name: 'Gen5'
          description: >
              PCIe v5.0 device

        - name: 'Gen6'
          description: >
              PCIe v6.0 device

        - name: 'Unknown'
          description: >
              Version of the PCIe device is unknown