description: >
    This defines a Port to be exposed for system management.
    It contains properties that describe a port of a switch, controller,
    chassis, or any other device that could be connected to another entity.

properties:
    - name: Type
      type: enum[self.PortType]
      default: UpstreamPort
      description: >
          Indicates the port type.

    - name: Protocol
      type: enum[self.PortProtocol]
      default: Ethernet
      description: >
          The protocol being sent over this port.

    - name: CurrentSpeed
      type: double
      description: >
          The current speed of this port in Gbps.

    - name: MaxSpeed
      type: double
      description: >
          The maximum speed of this port in Gbps.

    - name: TargetSpeed
      type: double
      default: NaN
      description: >
          The requested link speed configured in Gbps.

    - name: MaxReadRequestSizeBytes
      type: uint32
      default: 128
      description: >
          Maximum Read Request Size in bytes (128, 256, 512, 1024, 2048, 4096).

    - name: MaxPayloadSizeBytes
      type: uint32
      default: 128
      description: >
          Maximum Payload Size in bytes (128, 256, 512, 1024, 2048, 4096).

    - name: CommonClockMode
      type: enum[self.ClockMode]
      default: SeparateClockMode
      description: >
          PCIe clock mode configuration indicating common or separate clock operation.

enumerations:
    - name: PortType
      description: >
          Possible port types.
      values:
        - name: BidirectionalPort
          description: >
              This port connects to any type of device.
        - name: DownstreamPort
          description: >
              This port connects to a target device.
        - name: EndpointPort
          description: >
              PCIe Endpoint device.
        - name: InterswitchPort
          description: >
              This port connects to another switch.
        - name: ManagementPort
          description: >
              This port connects to a switch manager.
        - name: RootPort
          description: >
              Root Port of a Root Complex.
        - name: UnconfiguredPort
          description: >
              This port has not yet been configured.
        - name: UpstreamPort
          description: >
              This port connects to a host device.

    - name: PortProtocol
      description: >
          Possible protocols supported by port.
      values:
        - name: Ethernet
          description: >
              An Ethernet.
        - name: FC
          description: >
              A Fibre Channel.
        - name: NVLink
          description: >
              An NVLink.
        - name: OEM
          description: >
              An OEM-specific.
        - name: PCIe
          description: >
              A PCIe.
        - name: InfiniBand
          description: >
              An InfiniBand.

    - name: ClockMode
      description: >
          PCIe clock mode configuration.
      values:
        - name: SeparateClockMode
          description: >
              Separate reference clock mode (value 0).
        - name: CommonClockMode
          description: >
              Common reference clock mode (value 1).
