description: >
    Implement this special interface to provide count of how many times the GPU has entered and exited specific reset states.

properties:
    - name: LastResetType
      type: enum[self.ResetTypes]
      description: >
          Type of the last reset GPU enetered, e.g. PF-FLR, Conventional, Fundamental, IRoT.
    
    - name: PF_FLR_ResetEntryCount
      type: double
      default: NaN
      description: >
          PF-FLR reset entry count, count of how many times the GPU has entered reset state, Power Loss and Factory Programming Reset

    - name: PF_FLR_ResetExitCount
      type: double
      default: NaN
      description: >
          PF-FLR reset exit count, count of how many times the GPU has exited reset state , Power Loss and Factory Programming Reset

    - name: ConventionalResetEntryCount
      type: double
      default: NaN
      description: >
          Conventional, non-fundamental reset entry count, count of how many times the GPU has entered reset state
    
    - name: ConventionalResetExitCount
      type: double
      default: NaN
      description: >
          Conventional, non-fundamental reset exit count, count of how many times the GPU has exited reset state

    - name: FundamentalResetEntryCount
      type: double
      default: NaN
      description: >
          Fundamental (PERST#) reset entry count, count of how many times the GPU has entered reset state
    
    - name: FundamentalResetExitCount
      type: double
      default: NaN
      description: >
          Fundamental (PERST#) reset exit count, count of how many times the GPU has exited reset state
    
    - name: IRoTResetExitCount
      type: double
      default: NaN
      description: >
          Internal Root of Trust (IRoT) reset exit count
    
    - name: BootReason
      type: array[enum[self.BootReasonTypes]]
      description: >
          Boot raseon for device.

enumerations:
    - name: ResetTypes
      description: >
        Reset types.
      values:
          - name: "PF_FLR"
            description: >
              PF-FLR reset type, Power Loss and Factory Programming Reset
          - name: "Conventional"
            description: >
              Conventional, non fundamental reset type
          - name: "Fundamental"
            description: >
              Fundamental reset type
          - name: "IRoTReset"
            description: >
              IRoT Reset Type

    - name: BootReasonTypes
      description: >
        Enum to provide the reason/cause for reset.
      values:
          - name: "WakeUp"
            description: >
              Boot reason is device wake up.
          - name: "PowerOn"
            description: >
              Device is powered on.
          - name: "VoltageDetect"
            description: >
              Boot is due to voltage detect.
          - name: "WarmReset"
            description: >
              Warm reset is done on device.
          - name: "FatalError"
            description: >
              Device booted due to some fatal error.
          - name: "Pin"
            description: >
              Device boot due to pin change.
          - name: "DebugAccessPort"
            description: >
              Boot reason is debug access port.
          - name: "ResetTimeout"
            description: >
              Device reset timed out.
          - name: "LowPowerAcknowledgeTimeout"
            description: >
              Device low power acknowledge timed out.
          - name: "SystemClockGenerator"
            description: >
              Boot happened due to system clock generator.
          - name: "WindowedWatchdog0"
            description: >
              Boot reason is windowed watchdog type 0.
          - name: "WindowedWatchdog1"
            description: >
              Boot reason is windowed watchdog type 1.
          - name: "Software"
            description: >
              Device booted due to some software reson.
          - name: "LockupReset"
            description: >
              Device lockup reset.
          - name: "CPU1"
            description: >
              Device booted due to CPU1.
          - name: "VBAT"
            description: >
              Device booted due to VBAT.
          - name: "CodeWatchdog0"
            description: >
              Boot reason is code watchdog type 0.
          - name: "CodeWatchdog1"
            description: >
              Boot reason is code watchdog type 1.
          - name: "JTAG"
            description: >
              Device booted due to JTAG.
          - name: "SecurityViolation"
            description: >
              Device booted due to security violation
          - name: "Tamper"
            description: >
              Device booted due to tamper.
          - name: "IAccViol"
            description: >
              Instruction access violation.
          - name: "DAccViol"
            description: >
              Data access violation.
          - name: "Munstkerr"
            description: >
              MemManage fault on unstacking.
          - name: "Mstkerr"
            description: >
              MemManage fault on stacking.
          - name: "MMFarValid"
            description: >
              MMFar valid flag.
          - name: "BFarValid"
            description: >
              BFar valid flag.
          - name: "Stkerr"
            description: >
              Bus Fault on Stacking.
          - name: "Unstkerr"
            description: >
              Bus Fault on Unstacking.
          - name: "ImpreciseError"
            description: >
              Imprecise data bus error.
          - name: "PreciseError"
            description: >
              Precise data bus error.
          - name: "IBusErr"
            description: >
              Instruction bus error.
          - name: "UndefInstr"
            description: >
              Undefined instruction usage fault.
          - name: "InvState"
            description: >
              Invalid state usage fault.
          - name: "InvPC"
            description: >
              Invalid PC Load usage fault.
          - name: "NoCP"
            description: >
              No Coprocessor usage fault.
          - name: "Unaligned"
            description: >
              Unaligned access usage fault.
          - name: "DevByZero"
            description: >
              Divide by zero usage fault.
          - name: "VectTbl"
            description: >
              Bus Fault on Vector Table read.
          - name: "Forced"
            description: >
              Forced hardfault.  
          - name: "DebugEvt"
            description: >
              Debug event (Debug Usage Fault).  
          - name: "MCTP"
            description: >
              MCTP fault.
          - name: "I2C"
            description: >
              I2C fault.
          - name: "I3C"
            description: >
              I3C fault.
          - name: "PLDM"
            description: >
              PLDM fault.
          - name: "USB"
            description: >
              USB fault.
          - name: "Flash"
            description: >
              Flash fault.
          - name: "Logger"
            description: >
              Logger fault.
          - name: "SPDM"
            description: >
              SPMD fault.