description: >
    Controls whether power capping enforcement is enabled or disabled. The
    enforced power cap limit is not configurable through this interface.

properties:
    - name: CurrentMode
      type: enum[self.PowerCapMode]
      flags:
          - readonly
      description: >
          The current power capping mode. Implementations shall publish
          Enabled or Disabled.

    - name: PendingMode
      type: enum[self.PowerCapMode]
      description: >
          The requested power capping mode. The implementation determines
          when this mode becomes current.
          Implementations shall publish the resolved Enabled or Disabled
          value. Default is accepted as a reset request but shall not be
          retained as the property value.
          Only writable when IsModeConfigurable is true. Attempts to write
          when IsModeConfigurable is false shall return NotAllowed.
      errors:
          - xyz.openbmc_project.Common.Error.InvalidArgument
          - xyz.openbmc_project.Common.Error.NotAllowed
          - xyz.openbmc_project.Common.Error.Unavailable
          - xyz.openbmc_project.Common.Error.InternalFailure

    - name: IsModeConfigurable
      type: boolean
      flags:
          - readonly
      default: false
      description: >
          An indication of whether PendingMode is writable. Determined by the
          implementation and platform capabilities.

enumerations:
    - name: PowerCapMode
      description: >
          Power capping mode values.
      values:
          - name: Default
            description: >
                Requests that the implementation restore its default power
                capping mode. This value is write-only; CurrentMode and
                PendingMode shall report the resolved Enabled or Disabled
                value.
          - name: Enabled
            description: >
                Power capping is enabled.
          - name: Disabled
            description: >
                Power capping is disabled.
