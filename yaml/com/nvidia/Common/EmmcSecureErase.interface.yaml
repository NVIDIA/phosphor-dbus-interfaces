description: >
    An interface to trigger secure erase of the eMMC storage device.
    The erase is performed upon the next BMC reboot by setting the
    u-boot environment variable emmc_secure_erase. All data on the
    device is permanently wiped.
    Service: xyz.openbmc_project.Software.BMC.Inventory
    Path: /xyz/openbmc_project/software
    Sync/Async: Synchronous method, like complete-reset and factory-reset.
    Progress: No progress tracking. The method only sets the env variable
    and returns; the actual erase occurs upon the next reboot.
    Concurrent calls: The actual erase occurs upon reboot - at that time
    phosphor-bmc-inventory/bmcweb are not running, so the method cannot
    be invoked while the erase is in progress. If called again before
    reboot: (1) Before the first call completes - the service is
    single-threaded, subsequent calls are queued and run sequentially.
    (2) After the first call returns - a second call simply sets the same
    env var (emmc_secure_erase=yes) again.
methods:
    - name: EmmcSecureErase
      description: >
          Sets the u-boot environment variable to trigger secure erase
          of the eMMC storage device upon the next BMC reboot (the
          actual erase occurs at reboot). Synchronous method - the
          caller blocks until the env variable is written.
      errors:
          - xyz.openbmc_project.Common.Error.InternalFailure
paths:
  - namespace: /xyz/openbmc_project/software
