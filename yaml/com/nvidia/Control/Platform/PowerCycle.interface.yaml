description: >
    Provides platform power-cycle operations that may remove and restore
    standby or utility-equivalent power. Implementations advertise only the
    operations supported for each target and hide platform-specific sequencing
    mechanisms such as systemd units and GPIOs from clients.

paths:
    - namespace: /xyz/openbmc_project/control/power_cycle
      description: >
          Root path for platform power-cycle control objects: one object per
          host (for example host0) for host-level operations, and one object
          per component that can be power-cycled on its own (for example
          cpu0). A component object implements the "chassis" association to
          its chassis inventory object.

methods:
    - name: RequestPowerCycle
      description: >
          Requests the selected platform power-cycle operation. A successful
          method return means the implementation accepted and dispatched the
          request; it does not indicate that the physical power cycle completed.
      parameters:
          - name: Type
            type: enum[self.PowerCycleType]
            description: >
                Power-cycle operation to request. The value must be present in
                SupportedPowerCycleTypes on this object. Implementations should
                reject a valid type that is not present with
                UnsupportedRequest.
      errors:
          - xyz.openbmc_project.Common.Error.InvalidArgument
          - xyz.openbmc_project.Common.Error.UnsupportedRequest
          - xyz.openbmc_project.Common.Error.NotAllowed
          - xyz.openbmc_project.Common.Error.Unavailable
          - xyz.openbmc_project.Common.Error.InternalFailure

properties:
    - name: SupportedPowerCycleTypes
      type: array[enum[self.PowerCycleType]]
      description: >
          Power-cycle operations supported by this object. Clients shall not
          request or advertise operations absent from this list.
      flags:
          - readonly
    - name: Description
      type: string
      description: >
          Human-readable description of what a power cycle of this object
          covers, for clients to show next to the operation. Empty when the
          object does not provide one.
      flags:
          - readonly

associations:
    - name: chassis
      description: >
          Per-component objects shall implement the "chassis" association to
          link to the chassis inventory object of the component they
          power-cycle.
      reverse_name: power_cycle
      required_endpoint_interfaces:
          - xyz.openbmc_project.Inventory.Item.Chassis

enumerations:
    - name: PowerCycleType
      description: Platform power-cycle operations.
      values:
          - name: AuxPowerCycle
            description: >
                Performs the platform-defined auxiliary or standby power-cycle
                sequence, including normal host shutdown policy when available.
          - name: AuxPowerCycleForce
            description: >
                Performs the platform-defined forced auxiliary or standby
                power-cycle sequence without requiring successful host shutdown.
          - name: FullPowerCycle
            description: >
                Performs an immediate full platform power cycle as close as
                possible to removing and restoring utility power.
          - name: ComponentPowerCycle
            description: >
                Power-cycles only the component this object represents, for
                example a CPU, without resetting the rest of the platform.
                Reported only by per-component objects.
