description: >
  Implement if service supports fetching device debug information from device in chunks.
  
methods:
  - name: GetDebugInfo
    description: >
      Get debug information from device and append asynchronously to file descriptor.
    parameters:
      - name: DebugInfoType
        type: enum[self.DebugInformationType]
        description: >
          The type of debug informatio to be fetched from device.
      - name: Fd
        type: unixfd
        description: >
          Target file descriptor, where debug information request data will be appended.
    returns:
      - name: AsyncHandle
        type: object_path
        description: >
            DBus Object Path. Interfaces com.nvidia.Async.Status and
            com.nvidia.Async.Value at this returned Object Path can be used
            to retrieve the status and resultant value of the operation
            respectively.
    errors:
      - xyz.openbmc_project.Common.Error.InternalFailure
      - xyz.openbmc_project.Common.Error.InvalidArgument
      - xyz.openbmc_project.Common.Error.Unavailable
      
  - name: GetDiagnostics
    description: >
      Get diagnostics from device and append asynchronously to file descriptor.
    parameters:
      - name: Fd
        type: unixfd
        description: >
          Target file descriptor, where diagnostics request data will be appended.
    returns:
      - name: AsyncHandle
        type: object_path
        description: >
            DBus Object Path. Interfaces com.nvidia.Async.Status and
            com.nvidia.Async.Value at this returned Object Path can be used
            to retrieve the status and resultant value of the operation
            respectively.
    errors:
      - xyz.openbmc_project.Common.Error.InternalFailure
      - xyz.openbmc_project.Common.Error.Unavailable

properties:
  - name: SupportedDumpType
    type: enum[self.DumpType]
    description: >
      Type of dump to be fetched from device.
    default: "Other"

enumerations:
  - name: DebugInformationType
    description: >
      Possible types for debug information.
    values:
      - name: DeviceInformation
        description: >
          Device Information from device.
      - name: FWRuntimeData
        description: >
          FW runtime data from device.
      - name: FWSavedInfo
        description: >
          FW saved dump information from device.
      - name: DeviceDump
        description: >
          Device dump information which include FW saved dump & Device state.
      - name: Others
        description: >
          Others.

  - name: DumpType
    description: >
      Type of dump to be fetched from device. 
    values:
      - name: "Network"
        description: >
          Network dump.
      - name: "Diagnostics"
        description: >
          Diagnostics dump.
      - name: "Other"
        description: >
          Unknown dump.
