description: >
  Implement if service supports fetching log information from device in chunks.

methods:
  - name: GetLogInfo
    description: >
      Get log information from device and append asynchronously to file descriptor.
    parameters:
      - name: Fd
        type: unixfd
        description: >
          Target file descriptor, where log information request data will be appended.
    returns:
      - name: AsyncHandle
        type: object_path
        description: >
            DBus Object Path. Interfaces com.nvidia.Async.Status and
            com.nvidia.Async.Value at this returned Object Path can be used
            to retrieve the status and resultant value of the operation
            respectively.
    errors:
      - xyz.openbmc_project.Common.Error.InternalFailure
      - xyz.openbmc_project.Common.Error.InvalidArgument
      - xyz.openbmc_project.Common.Error.Unavailable

properties:
  - name: TimeSynced
    type: enum[self.TimeSyncFrom]
    description: >
      Indicates time is measured w.r.t which time epoch or bootup.
  - name: LostEvents
    type: uint64
    description: >
      The number of events that the system failed.
  - name: TimeStamp
    type: uint64
    description: >
      Timestamp is measured since TimeSynced in micro seconds.
  - name: EntryPrefix
    type: uint64
    description: >
      Log entry info, EntryPrefix.
  - name: EntrySuffix
    type: uint64
    description: >
      Log entry info, EntrySuffix.
  - name: Length
    type: uint64
    description: >
      Length is number of Dwords in the log entry.
      method.

enumerations:
  - name: TimeSyncFrom
    description: >
      Time is measured w.r.t which time epoch or bootup.
    values:
      - name: Boot
        description: >
          Time is measured since bootup.
      - name: Synced
        description: >
          Time is synced by the host.