description: >
    Implement this interface if the device supports enabling and disabling inband update functionality.
properties:
    - name: InbandUpdatePolicy
      type: enum[self.InbandPolicyState]
      description: >
          Indicates whether the InbandUpdatePolicy configuration 
          is enabled or disabled.
      flags:
          - readonly
    - name: ErrorCode
      type: struct[uint16, string]
      description: >
          This property indicates the error code and message when an 
          asynchronous command fails.
methods:
    - name: UpdatePolicy
      description: >
          This method updates the InbandUpdatePolicy 
          for the device. Using a method is preferred over setting properties 
          to support asynchronous operations.
      parameters:
          - name: State
            type: boolean
            description: >
                Set this parameter to true to enable the InbandUpdatePolicy 
                configuration and false to disable it.
      errors:
          - xyz.openbmc_project.Common.Error.InternalFailure
          - xyz.openbmc_project.Common.Error.InvalidArgument
enumerations:
    - name: InbandPolicyState
      description: >
          The possible states for the InbandUpdatePolicy configuration.
      values:
          - name: Enabled
            description: >
                Inband update is enabled
          - name: Disabled
            description: >
                Inband update is disabled
          - name: NotApplicable
            description: >
                Inband update is not applicable.