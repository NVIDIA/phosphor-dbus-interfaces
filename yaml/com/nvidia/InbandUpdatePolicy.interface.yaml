description: >
    Implement this interface to configure the inband update policy. It
    controls whether inband update is enabled or disabled. This interface is
    implemented by RoT chassis objects at
    /xyz/openbmc_project/inventory/system/chassis/<RoT>. The
    InbandUpdatePolicy property update operation is handled asynchronously
    via the com.nvidia.Async.Set interface. The Set method returns an
    object path implementing the com.nvidia.Async.Status interface to
    monitor the InbandUpdatePolicy update operation status.
properties:
    - name: InbandUpdatePolicy
      type: enum[self.InbandPolicyState]
      description: >
          Indicates whether the InbandUpdatePolicy configuration 
          is enabled or disabled.
enumerations:
    - name: InbandPolicyState
      description: >
          The possible states for the InbandUpdatePolicy configuration.
      values:
          - name: Enabled
            description: >
                Inband update policy is enabled
          - name: Disabled
            description: >
                Inband update policy is disabled