description: >
    Pre-boot diagnostic system-level configuration. The `Value` property
    carries a JSON-encoded SystemConfig payload (object or array of objects
    with ConfigType, TestDuration, DynamicData fields per spec §5.2.3).

properties:
    - name: Value
      type: string
      description: >
          JSON-encoded SystemConfig payload. Expected shape is a JSON array of
          objects, each containing ConfigType (uint8, max 1), TestDuration
          (uint8, 0 = per-TID, 1-3 = preset levels), and DynamicData (array of
          uint8, first element is TID count followed by TID values).
