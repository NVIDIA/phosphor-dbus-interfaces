description: >
    Interface for clearing BIOS non-volatile configuration storage.

methods:
    - name: Clear
      description: >
          Clear the BIOS NVRAM configuration region. This D-Bus method replies
          only after the clear operation reaches a terminal state. Callers must
          set the D-Bus method-call timeout to at least 60 seconds.
      errors:
          - xyz.openbmc_project.Common.Error.InternalFailure
          - xyz.openbmc_project.Common.Error.Unavailable
