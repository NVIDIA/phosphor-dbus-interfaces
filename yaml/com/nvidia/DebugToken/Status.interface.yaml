description: >
  Implement to provide debug token status data for NSM devices.

properties:
  - name: TokenDeviceID
    type: string
    description: >
      Token-specific device identification property of the device.
    default: ""
  - name: TokenType
    type: array[struct[enum[com.nvidia.DebugToken.Common.Types],array[enum[com.nvidia.DebugToken.Common.SubTypes]]]]
    description: >
      Array containing types and subtypes of the installed tokens.
      Each element is a struct with token type enum and array of subtype enums.
  - name: InstallationStatus
    type: boolean
    description: >
      Token installation status.
    default: false
  - name: ProcessingStatus
    type: boolean
    description: >
      Token processing status.
    default: false