description: >
  Common enumerations and types for Debug Token interfaces.

enumerations:
  - name: Types
    description: >
      Enum describing debug token types across all device types.
    values:
      - name: None
        description: >
          No token type.
      - name: FRC
        description: >
          FRC token type.
      - name: CRCS
        description: >
          CRCS token type.
      - name: CRDT
        description: >
          CRDT token type.
      - name: DebugFirmwareRunning
        description: >
          Debug firmware running token type.
      - name: DebugFirmwareUnlock
        description: >
          Debug firmware unlock token type.
      - name: OTPDumpEnable
        description: >
          OTP dump enable token type.
      - name: JtagUnlock
        description: >
          JTAG unlock token type.
      - name: HardwareUnlock
        description: >
          Hardware unlock token type.
      - name: RuntimeDebugUnlock
        description: >
          Runtime debug unlock token type.
      - name: FeatureUnlock
        description: >
          Feature unlock token type.
      - name: MTDT
        description: >
          MTDT token type.
      - name: CcplexArmJtagDebugCont
        description: >
          Ccplex ARM JTAG debug control token type.
      - name: NVJtagControl
        description: >
          NVIDIA JTAG control token type.
      - name: DiagnosticBoot
        description: >
          Diagnostic boot token type.
      - name: BpmpFirmwareDebugFS
        description: >
          BPMP firmware DebugFS token type.
      - name: FwDebugKnobs
        description: >
          Firmware debug knobs token type.
      - name: FirewallLifting
        description: >
          Firewall lifting token type.
      - name: Verbosity
        description: >
          Verbosity token type.
      - name: RAS
        description: >
          RAS token type.
