description: >
  Implement to describe the format of histogram supported by the object.

properties:
  - name: NumOfBuckets
    type: uint64
    default: 0
    description: >
      This represents number of buckets/bins availble in the histogram.
  - name: MinSamplingTime
    type: uint64
    default: 0
    description: >
      This represents the shortest time of sampling this histogram in millisec.
  - name: AccumulationCycle
    type: uint64
    default: 0
    description: >
      This represents the accumulation cycle of this histogram.
  - name: IncrementDuration
    type: uint64
    default: 0
    description: >
      This represents the time duration of an increment in the buckets in µsec (0 = runtime value).
  - name: UnitOfMeasure
    type: enum[self.BucketUnits]
    description: >
      This represents the unit of data/value stored in the buckets of histogram.
  - name: BucketDataType
    type: enum[self.BucketDataTypes]
    description: >
      This represents the data type of bucket information.

enumerations:
  - name: BucketUnits
    description: >
      Possible units supported for data/value present in buckets.
    values:
      - name: Watts
        description: >
          When data in buckets is represented in Watts.
      - name: Percent
        description: >
          When data in buckets is represented in percentage.
      - name: Count
        description: >
          When data in buckets is represented in counts.
      - name: Others
        description: >
          Others.
  - name: BucketDataTypes
    description: >
      Data Type of Bucket Value.
    values:
      - name: NvU8
        description: >
          Data types of Bucket Value is NvU8.
      - name: NvS8
        description: >
          Data types of Bucket Value is NvS8.
      - name: NvU16
        description: >
          Data types of Bucket Value is NvU16.
      - name: NvS16
        description: >
          Data types of Bucket Value is NvS16.
      - name: NvU32
        description: >
          Data types of Bucket Value is NvU32.
      - name: NvS32
        description: >
          Data types of Bucket Value is NvS32.
      - name: NvU64
        description: >
          Data types of Bucket Value is NvU64.
      - name: NvS64
        description: >
          Data types of Bucket Value is NvS64. 
      - name: NvS24_8
        description: >
          Data types of Bucket Value is NvS24_8.
      - name: Unknown
        description: >
          Data types of Bucket Value is not unknown. 
      