description: >
   Implement to provide Grace Memory Controller details, the memory spare channel presence state.

properties:
    - name: MemorySpareChannelPresence
      type: enum[self.Presence]
      description: >
            Memory Spare Channel presence for this processor.
      flags:
          - readonly

enumerations:
    - name: Presence
      description: >
        Possible states for memory spare channel presence
      values:
        - name: "Present"
          description: >
            Memory Spare Channel is present for this processor.
        - name: "NotPresent"
          description: >
            Memory Spare Channel is not present for this processor.
        - name: "Unavailable"
          description: >
            Memory Spare Channel information is not available for this processor.
