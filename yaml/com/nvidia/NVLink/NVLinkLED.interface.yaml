description: >
    Interface to read NV Link LED status
properties:
    - name: LED_State
      type: enum[self.LedState]
      description: >
        Set to the state of the NV Link LED
        Valid States
          Off - No link
          On Amber - Physical link state on any NVLink
          Flashing Amber - Beacon
          On Green - Link connected
          Flashing Green - Traffic

enumerations:
    - name: LedState
      description: >
        Possible states for the front panel NVLink staus LED's
      values:
        - name: Utilization_0_Percent
          description: >
            LED Steady Green, Link Up, 0% Utilization
        - name: Utilization_25_Percent
          description: >
            LED Blinking Green, Link Up, 25% Utilization
        - name: Utilization_50_Percent
          description: >
            LED Blinking Green, Link Up, 50% Utilization
        - name: Utilization_75_Percent
          description: >
            LED Blinking Green, Link Up, 75% Utilization
        - name: Utilization_100_Percent
          description: >
            LED Blinking Green, Link Up, 100% Utilization
        - name: Disabled
          description: >
            LED Amber, Link up, Disabled
        - name: No_Link
          description: >
            LED Off, No link
        - name: Beacon
          description: >
            LED Blinking Amber, Beacon
        - name: Read_Error
          description: >
            An error occured reading LED state



