description: >
    Manage the attested-wipe key and nonce on a BlueField ERoT.

methods:
    - name: GetWipeNonce
      description: >
          Generate a new wipe nonce on the ERoT and return it. The caller does
          not choose the nonce value.
      errors:
          - xyz.openbmc_project.Common.Error.InternalFailure
          - xyz.openbmc_project.Common.Error.NotAllowed
          - xyz.openbmc_project.Common.Error.ResourceNotFound
          - xyz.openbmc_project.Common.Error.Unavailable
          - xyz.openbmc_project.Common.Error.UnsupportedRequest
      returns:
          - name: Nonce
            type: array[byte]
            description: >
                The nonce generated by the ERoT. The array length is exactly
                8 bytes.

    - name: EnrollWipeKey
      description: >
          Enroll or replace the wipe public key on the ERoT.
          An empty Signature enrolls the first key. A Signature replaces
          a key that is already enrolled and covers the currently enrolled
          key and the nonce that ERoT holds. The caller does not supply the
          nonce.
      parameters:
          - name: PublicKey
            type: string
            description: >
                The 96-byte P-384 wipe public key, encoded as a lowercase
                hexadecimal string of exactly 192 characters.
          - name: Signature
            type: string
            description: >
                Signature over the currently enrolled key and the nonce the
                ERoT holds. Empty for the first enrollment. Otherwise the
                96-byte signature, encoded as a lowercase hexadecimal string
                of exactly 192 characters.
      errors:
          - xyz.openbmc_project.Common.Error.InternalFailure
          - xyz.openbmc_project.Common.Error.InvalidArgument
          - xyz.openbmc_project.Common.Error.NotAllowed
          - xyz.openbmc_project.Common.Error.ResourceNotFound
          - xyz.openbmc_project.Common.Error.Unavailable
          - xyz.openbmc_project.Common.Error.UnsupportedRequest

paths:
    - namespace: /xyz/openbmc_project/control
      segments:
          - name: factory_reset
            description: >
                Object that provides attested-wipe key management.
            value: factory_reset
