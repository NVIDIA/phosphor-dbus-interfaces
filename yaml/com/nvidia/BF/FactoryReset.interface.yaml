description: >
    Factory reset for a BlueField ERoT, including wipe-key enrollment,
    nonce retrieval, starting the wipe, and reading the flash log.

methods:
    - name: GetWipeNonce
      description: >
          Generate a new wipe nonce on the ERoT identified by EID and return
          it. The caller does not choose the nonce value.
      parameters:
          - name: EID
            type: byte
            description: >
                Endpoint ID of the ERoT that generates the nonce.
      errors:
          - xyz.openbmc_project.Common.Error.InternalFailure
          - xyz.openbmc_project.Common.Error.NotAllowed
          - xyz.openbmc_project.Common.Error.ResourceNotFound
          - xyz.openbmc_project.Common.Error.Unavailable
          - xyz.openbmc_project.Common.Error.UnsupportedRequest
      returns:
          - name: Nonce
            type: array[byte]
            description: >
                The nonce generated by the ERoT. The array length is exactly
                8 bytes.

    - name: EnrollWipeKey
      description: >
          Enroll or replace the wipe public key on the ERoT identified by
          EID. An empty Signature enrolls the first key. A Signature replaces
          a key that is already enrolled and covers the currently enrolled
          key and the nonce that ERoT holds. The caller does not supply the
          nonce.
      parameters:
          - name: EID
            type: byte
            description: >
                Endpoint ID of the ERoT that receives the key.
          - name: PublicKey
            type: array[byte]
            description: >
                The P-384 wipe public key. The array length is exactly 96
                bytes.
          - name: Signature
            type: array[byte]
            description: >
                Signature over the currently enrolled key and the nonce the
                ERoT holds. Empty for the first enrollment. Otherwise the
                array length is exactly 96 bytes.
      errors:
          - xyz.openbmc_project.Common.Error.InternalFailure
          - xyz.openbmc_project.Common.Error.InvalidArgument
          - xyz.openbmc_project.Common.Error.NotAllowed
          - xyz.openbmc_project.Common.Error.ResourceNotFound
          - xyz.openbmc_project.Common.Error.Unavailable
          - xyz.openbmc_project.Common.Error.UnsupportedRequest

    - name: AttestedWipe
      description: >
          Start an attested wipe. The method returns when the request has
          been accepted. Follow progress on
          xyz.openbmc_project.Common.Progress on this object.
      parameters:
          - name: RotSignature
            type: string
            description: >
                Hexadecimal P-384 signature over the RoT portion of the
                request. 192 hexadecimal characters.
          - name: ConfigDataSignature
            type: string
            description: >
                Hexadecimal P-384 signature over ConfigData. 192 hexadecimal
                characters.
          - name: ConfigData
            type: string
            description: >
                Base64-encoded wipe selector.
      errors:
          - xyz.openbmc_project.Common.Error.InternalFailure
          - xyz.openbmc_project.Common.Error.InvalidArgument
          - xyz.openbmc_project.Common.Error.NotAllowed
          - xyz.openbmc_project.Common.Error.Unavailable
          - xyz.openbmc_project.Common.Error.UnsupportedRequest

    - name: RetrieveFlashLog
      description: >
          Return the path of the flash log from the last attested wipe.
      errors:
          - xyz.openbmc_project.Common.Error.InternalFailure
          - xyz.openbmc_project.Common.Error.InvalidArgument
          - xyz.openbmc_project.Common.Error.NotAllowed
          - xyz.openbmc_project.Common.Error.Unavailable
          - xyz.openbmc_project.Common.Error.UnsupportedRequest
      returns:
          - name: Path
            type: string
            description: >
                Path of the flash log.

paths:
    - namespace: /xyz/openbmc_project/control
      segments:
          - name: factory_reset
            description: >
                Object that provides factory reset.
            value: factory_reset
