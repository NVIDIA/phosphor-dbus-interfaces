description: >
    Implement to provide memory Row ReMapping Counts.
properties:
    - name: ceRowRemappingCount
      type: uint32
      description: >
          Contains correctable Row Mapping Count.
      flags:
          - readonly
    - name: ueRowRemappingCount
      type: uint32
      description: >
          Contains uncorrectable Row Mapping Count.
      flags:
          - readonly
    - name: RowRemappingFailureState
      type: enum[self.RowRemappingFailureStates]
      default: Unknown
      description: >
          Indicates whether row-remapping has failed. Unknown marks the
          reading as not available (device unreachable or not yet polled).
      flags:
          - readonly
    - name: RowRemappingPendingState
      type: enum[self.RowRemappingPendingStates]
      default: Unknown
      description: >
          Indicates whether row-remapping is pending. Unknown marks the
          reading as not available (device unreachable or not yet polled).
      flags:
          - readonly
    - name: MaxRemappingAvailablityBankCount
      type: uint16
      description: >
          This property shall contain the number of banks with the maximum remapping availability.
      flags:
          - readonly
    - name: HighRemappingAvailablityBankCount
      type: uint16
      description: >
          This property shall contain the number of banks with high remapping availability.
      flags:
          - readonly
    - name: LowRemappingAvailablityBankCount
      type: uint16
      description: >
          This property shall contain the number of banks with Low remapping availability.
      flags:
          - readonly
    - name: PartialRemappingAvailablityBankCount
      type: uint16
      description: >
          This property shall contain the number of banks with partial remapping availability.
      flags:
          - readonly
    - name: NoRemappingAvailablityBankCount
      type: uint16
      description: >
          This property shall contain the number of banks with no remapping availability.
      flags:
          - readonly

enumerations:
    - name: RowRemappingFailureStates
      description: >
          Row-remapping failure state.
      values:
          - name: 'True'
            description: >
                Row-remapping has failed.
          - name: 'False'
            description: >
                Row-remapping has not failed.
          - name: Unknown
            description: >
                Failure state is not available (device unreachable or not
                yet polled).
    - name: RowRemappingPendingStates
      description: >
          Row-remapping pending state.
      values:
          - name: 'True'
            description: >
                Row-remapping is pending.
          - name: 'False'
            description: >
                Row-remapping is not pending.
          - name: Unknown
            description: >
                Pending state is not available (device unreachable or not
                yet polled).
