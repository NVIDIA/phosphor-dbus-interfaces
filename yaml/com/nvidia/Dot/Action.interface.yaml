description: >
  Implement to provide DOT (Device Ownership Transfer) functionalities.

methods:
  - name: DotCAKInstall
    description: >
      Install DOT CAK (Code Authentication Key).
    parameters:
      - name: CakKeyAuthScheme
        type: enum[self.KeyAuthScheme]
        description: >
          CAK key authentication scheme.
      - name: CakEcdsaKey
        type: string
        description: >
          CAK ECDSA key data.
      - name: CakLmsKey
        type: string
        description: >
          CAK LMS key data.
      - name: LakKeyAuthScheme
        type: enum[self.KeyAuthScheme]
        description: >
          LAK key authentication scheme.
      - name: LakEcdsaKey
        type: string
        description: >
          LAK ECDSA key data.
      - name: LakLmsKey
        type: string
        description: >
          LAK LMS key data.
      - name: LockDisable
        type: boolean
        description: >
          Lock disable flag (false: lock enabled, true: lock disabled).
      - name: MinSvn
        type: uint32
        description: >
          Minimum Security Version Number.
    errors:
      - xyz.openbmc_project.Common.Error.InternalFailure
      - xyz.openbmc_project.Common.Error.InvalidArgument
      - xyz.openbmc_project.Common.Error.Unavailable
    returns:
      - name: ObjectPath
        type: object_path
        description: >
            DBus object path of the async operation status object.
            Interface com.nvidia.Async.Status at this returned object path
            can be used to retrieve the status of the operation.

  - name: Bypass
    description: >
      Bypass DOT CAK installation. This method allows bypassing the 
      DOT authentication requirement.
    errors:
      - xyz.openbmc_project.Common.Error.InternalFailure
      - xyz.openbmc_project.Common.Error.InvalidArgument
      - xyz.openbmc_project.Common.Error.Unavailable
    returns:
      - name: ObjectPath
        type: object_path
        description: >
            DBus object path of the async operation status object.
            Interface com.nvidia.Async.Status at this returned object path
            can be used to retrieve the status of the operation.

  - name: UnlockChallenge
    description: >
      Request an unlock challenge from the device prior to unlock operations.
    parameters:
      - name: UnlockType
        type: enum[self.UnlockType]
        description: >
          Unlock operation type.
    errors:
      - xyz.openbmc_project.Common.Error.InternalFailure
      - xyz.openbmc_project.Common.Error.InvalidArgument
      - xyz.openbmc_project.Common.Error.Unavailable
    returns:
      - name: ObjectPath
        type: object_path
        description: >
            DBus object path of the async operation status object.
            Interface com.nvidia.Async.Status at this returned object path
            can be used to retrieve the status of the operation.

  - name: Unlock
    description: >
      Unlock DOT to transition from locked to volatile state or disabled to uninitialized state.
    parameters:
      - name: UnlockSignatureAuthScheme
        type: enum[self.KeyAuthScheme]
        description: >
          Signature authentication scheme.
      - name: ECDSASignature
        type: string
        description: >
          ECDSA signature.
      - name: LMSSignature
        type: string
        description: >
          LMS signature.
    errors:
      - xyz.openbmc_project.Common.Error.InternalFailure
      - xyz.openbmc_project.Common.Error.InvalidArgument
      - xyz.openbmc_project.Common.Error.Unavailable
    returns:
      - name: ObjectPath
        type: object_path
        description: >
            DBus object path of the async operation status object.
            Interface com.nvidia.Async.Status at this returned object path
            can be used to retrieve the status of the operation.

  - name: Lock
    description: >
      Lock DOT to transition from volatile state to locked state.
    parameters:
      - name: CakKeyAuthScheme
        type: enum[self.KeyAuthScheme]
        description: >
          CAK key authentication scheme.
      - name: CakEcdsaKey
        type: string
        description: >
          CAK ECDSA key data.
      - name: CakLmsKey
        type: string
        description: >
          CAK LMS key data.
      - name: LakKeyAuthScheme
        type: enum[self.KeyAuthScheme]
        description: >
          LAK key authentication scheme.
      - name: LakEcdsaKey
        type: string
        description: >
          LAK ECDSA key data.
      - name: LakLmsKey
        type: string
        description: >
          LAK LMS key data.
      - name: UnlockMethod
        type: enum[self.UnlockMethod]
        description: >
          Unlock method for lock operation.
      - name: StaticChallenge
        type: string
        description: >
          Required when UnlockMethod is StaticValue
      - name: LockSignatureAuthScheme
        type: enum[self.KeyAuthScheme]
        description: >
          Signature authentication scheme.
      - name: ECDSASignature
        type: string
        description: >
          ECDSA signature.
      - name: LMSSignature
        type: string
        description: >
          LMS signature.
    errors:
      - xyz.openbmc_project.Common.Error.InternalFailure
      - xyz.openbmc_project.Common.Error.InvalidArgument
      - xyz.openbmc_project.Common.Error.Unavailable
    returns:
      - name: ObjectPath
        type: object_path
        description: >
            DBus object path of the async operation status object.
            Interface com.nvidia.Async.Status at this returned object path
            can be used to retrieve the status of the operation.

  - name: Disable
    description: >
      Disable DOT to transition from uninitialized state to disabled state.
    parameters:
      - name: LakKeyAuthScheme
        type: enum[self.KeyAuthScheme]
        description: >
          LAK key authentication scheme.
      - name: LakEcdsaKey
        type: string
        description: >
          LAK ECDSA key data.
      - name: LakLmsKey
        type: string
        description: >
          LAK LMS key data.
      - name: UnlockMethod
        type: enum[self.UnlockMethod]
        description: >
          Unlock method for disable operation.
      - name: StaticChallenge
        type: string
        description: >
          Required when Unlock_Method is StaticValue.
      - name: DisableSignatureAuthScheme
        type: enum[self.KeyAuthScheme]
        description: >
          Signature authentication scheme.
      - name: ECDSASignature
        type: string
        description: >
          ECDSA signature.
      - name: LMSSignature
        type: string
        description: >
          LMS signature.
    errors:
      - xyz.openbmc_project.Common.Error.InternalFailure
      - xyz.openbmc_project.Common.Error.InvalidArgument
      - xyz.openbmc_project.Common.Error.Unavailable
    returns:
      - name: ObjectPath
        type: object_path
        description: >
            DBus object path of the async operation status object.
            Interface com.nvidia.Async.Status at this returned object path
            can be used to retrieve the status of the operation.

  - name: GetInfo
    description: >
      Get DOT information including version, fuse state, and DOT blob.
    errors:
      - xyz.openbmc_project.Common.Error.InternalFailure
      - xyz.openbmc_project.Common.Error.InvalidArgument
      - xyz.openbmc_project.Common.Error.Unavailable
    returns:
      - name: ObjectPath
        type: object_path
        description: >
            DBus object path of the async operation status object.
            Interface com.nvidia.Async.Status at this returned object path
            can be used to retrieve the status of the operation.

enumerations:
  - name: KeyAuthScheme
    description: >
      Key authentication scheme types for DOT operations.
    values:
      - name: Ecdsa
        description: >
          ECDSA-only authentication scheme.
      - name: Hybrid
        description: >
          Hybrid ECDSA+LMS authentication scheme.

  - name: UnlockType
    description: >
      Type of unlock operation for DOT unlock challenge.
    values:
      - name: OwnerUnlock
        description: >
          Owner unlock type, indicates an owner calling DOT_UNLOCK.
      - name: VendorUnlock
        description: >
          Vendor unlock type, indicates a vendor calling DOT_OVERRIDE.

  - name: UnlockMethod
    description: >
      Unlock method for lock operation.
    values:
      - name: DeviceUniqueIdentifier
        description: >
          Per-device unique identifier.
      - name: RandomNonce
        description: >
          Randomly generated nonce.
      - name: StaticValue
        description: >
          Static value provided during lock or disable.
